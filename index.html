<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather-App </title>
  <link rel="stylesheet" href="WeatherApp.css">
  <script src="https://kit.fontawesome.com/021c028c96.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <h2>Weather App</h2>
    <div class="search">
      <input placeholder="enter the city" spellcheck="false" id="search">
      <button id="btn"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
    <div id="error">
           Invalid city name
    </div>
    <div class="weather">
      <p id="sign"><i class="fa-solid fa-cloud-rain"></i></p>
      <h2 class="temp">22°C</h2>
      <h1 class="city">New York City</h1>
      <div class="details">
        <div class="col">
           <i class="fa-solid fa-water"></i>
           <div>
              <p>Humidity</p>
              <p class="humidity">50%</p>
           </div>
        </div>
        <div class="col">
           <i class="fa-solid fa-wind"></i>
           <div>
              <p>Wind speed</p>
              <p class="wind">15 km/h</p>
           </div>
        </div>
        
      </div>
    </div>
  </div>
  <script src="WeatherApp.js"></script>
</body>
</html>
